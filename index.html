<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dad1ca" />
    <title>Hand Lab</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="stage"></canvas>
      <video id="video" playsinline muted aria-hidden="true"></video>
      <div id="overlay"></div>

      <nav id="scene-toggle" role="radiogroup" aria-label="Scene"></nav>

      <section id="intro" aria-labelledby="welcome-title">
        <div class="welcome-main">
          <h1 id="welcome-title">
            <span>WELCOME TO</span>
            <span class="hand-slot" aria-hidden="true">
              <span class="hand-sway"><span class="hand-flip"><img src="/src/assets/hand-flowers.png" alt="" width="848" height="1264" /></span></span>
            </span>
            <span>LAB.</span>
          </h1>
          <button id="start" class="welcome-start" type="button">Start your camera to begin</button>
          <p id="message" role="status" aria-live="polite"></p>
          <button id="use-mouse" class="welcome-link" type="button">or use your mouse</button>
        </div>
        <p class="welcome-foot-left">throw your hands in the air<br />to do random cool things.</p>
        <p class="welcome-foot-right">by sehaz nagpal</p>
      </section>

      <div id="mock-badge" hidden>Simulated hands (?mock=1)</div>

      <div id="toolbar" hidden>
        <button id="stop" type="button">Stop camera</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
