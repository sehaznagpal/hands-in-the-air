<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dad1ca" />
    <title>Throw Your Hands in the Air</title>
    <meta name="description" content="Throw your hands in the air to do random cool things. Hand-tracking toys that run in your browser; your video stays on your device." />
    <meta property="og:title" content="Throw Your Hands in the Air" />
    <meta property="og:description" content="Throw your hands in the air to do random cool things." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="stage"></canvas>
      <video id="video" playsinline muted aria-hidden="true"></video>
      <div id="overlay"></div>

      <a id="wordmark" href="#home">Throw Your Hands in the Air</a>
      <nav id="scene-toggle" role="radiogroup" aria-label="Scene"></nav>

      <section id="home" aria-labelledby="home-title">
        <div class="home-inner">
          <h1 id="home-title"><span class="l1">THROW YOUR HANDS</span> <span class="l2">IN THE AIR!</span></h1>
          <p class="home-sub">(to do random cool things.)</p>
          <button id="start" class="home-start" type="button">Turn on camera to start</button>
          <p class="home-privacy">Your video stays on your device.</p>
          <p id="message" role="status" aria-live="polite"></p>
          <button id="use-mouse" class="home-link" type="button">No camera? Try it with your mouse</button>
          <p class="home-choose">CHOOSE ONE TO START.</p>
          <ul id="home-cards" class="home-cards"></ul>
        </div>
        <p class="home-foot">by sehaz nagpal</p>
      </section>

      <div id="mock-badge" hidden>Simulated hands (?mock=1)</div>

      <div id="preview" data-state="off">
        <div class="preview-frame">
          <canvas id="preview-canvas" aria-label="Camera preview with hand skeleton"></canvas>
          <button id="preview-min" class="preview-min" type="button" aria-label="Hide camera preview"></button>
        </div>
        <button id="preview-fab" class="preview-fab" type="button" aria-label="Show camera preview" tabindex="-1"></button>
      </div>

      <div id="dock" hidden>
        <div id="help-card" role="dialog" aria-label="How to use this scene" hidden>
          <button id="help-close" class="help-close" type="button" aria-label="Close help">×</button>
          <div id="help-body"></div>
        </div>
        <button id="help-btn" class="pill round" type="button" aria-label="Help" aria-expanded="false" aria-controls="help-card">?</button>
        <button id="cam-btn" class="pill blue" type="button">stop camera</button>
        <p id="dock-status" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
