<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1ead8" />
    <title>Hand Canvas</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="stage"></canvas>
      <video id="video" playsinline muted aria-hidden="true"></video>
      <div id="overlay"></div>

      <section id="intro">
        <h1>Hand Canvas</h1>
        <p class="lede">Move your hands in front of the camera and watch them draw.</p>
        <button id="start" type="button">Start camera</button>
        <p id="message" role="status" aria-live="polite"></p>
        <p class="privacy">Your camera stays on your device.</p>
      </section>

      <div id="mock-badge" hidden>Simulated hands (?mock=1)</div>

      <div id="toolbar" hidden>
        <button id="stop" type="button">Stop camera</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
